<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>הדף לא נמצא (404) — יניב אפרים</title>
  <meta name="robots" content="noindex" />
  <!--
    עמוד 404 עצמאי לחלוטין: כל העיצוב מוטמע כאן, בלי קבצים חיצוניים.
    הסיבה — GitHub Pages מגיש את הקובץ הזה עבור כל כתובת חסרה, בכל עומק,
    ולכן נתיב יחסי לקובץ CSS או תמונה עלול להישבר. עצמאי = תמיד עובד.
  -->
  <style>
    :root {
      --bg: #14110e;
      --panel: #1d1915;
      --text: #f1e9dd;
      --muted: #a99e8d;
      --accent: #c8873f;
      --accent-dark: #a86f2c;
      --border: rgba(255, 255, 255, 0.08);
    }
    :root[data-theme="light"] {
      --bg: #f7f2ea;
      --panel: #ffffff;
      --text: #2a2521;
      --muted: #6b6154;
      --accent: #a86f2c;
      --accent-dark: #8a5a20;
      --border: rgba(0, 0, 0, 0.1);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Assistant", system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.6;
    }
    .box {
      max-width: 520px;
      width: 100%;
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 48px 32px;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.25);
    }
    .code {
      font-size: 4.5rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--accent);
      margin: 0;
      line-height: 1;
    }
    h1 {
      font-family: "Frank Ruhl Libre", Georgia, serif;
      font-size: 1.6rem;
      margin: 18px 0 10px;
      color: var(--text);
    }
    p {
      color: var(--muted);
      margin: 0 auto 28px;
      max-width: 40ch;
    }
    .home-link {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 12px;
      transition: background 0.15s ease;
    }
    .home-link:hover { background: var(--accent-dark); }
    .brand {
      margin-top: 28px;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="box">
    <p class="code">404</p>
    <h1>הדף הזה לא נמצא</h1>
    <p>
      הכתובת שהגעת אליה לא קיימת — אולי קישור שבור, טעות הקלדה, או שהדף עבר
      או הוסר. אפשר לחזור לעמוד הבית ולהמשיך משם.
    </p>
    <a id="home" class="home-link" href="/">חזרה לעמוד הבית</a>
    <div class="brand">יניב אפרים — מאגר ידע אישי</div>
  </div>

  <script>
    (function () {
      // מצב תצוגה — לפי אותה העדפה שנשמרת בשאר האתר
      try {
        if (localStorage.getItem("kb-theme") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      } catch (e) {}

      // קישור "הביתה" שעובד בכל סביבה: תת-נתיב של GitHub Pages
      // (למשל /yaniv-efraim-kb/), דומיין אישי, או localhost.
      var parts = location.pathname.split("/").filter(Boolean);
      var base = "/";
      if (location.hostname.indexOf("github.io") !== -1 && parts.length) {
        base = "/" + parts[0] + "/";
      }
      document.getElementById("home").setAttribute("href", base);
    })();
  </script>
</body>
</html>
